dataset:
  name: September independent buried-field audit
  checked_at: '2026-09-16'
  require_evidence: true
  selection: Eight identities selected for ecosystem variety before reading dotrepo
    answers. Seventeen documented commands and security contacts curated from pinned
    upstream sources. Not a representative random sample; no model extraction. Gold
    frozen before scoring. No claim of total project build/test coverage.
