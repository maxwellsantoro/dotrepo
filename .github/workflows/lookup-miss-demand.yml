name: lookup-miss-fixture-proof

# Explicit offline proof only. Process real exported Worker logs locally with
# scripts/export_lookup_miss_demand.py --input; this workflow collects no demand.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lookup-miss-demand
  cancel-in-progress: true

jobs:
  export-demand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Create and sync Python environment
        run: |
          uv venv
          uv sync --dev --locked
      - name: Export fixture proof
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y%m%d)"
          output="$RUNNER_TEMP/lookup-miss-fixture-proof"
          uv run python scripts/export_lookup_miss_demand.py \
            --input scripts/fixtures/lookup_miss_sample.log \
            --output-dir "$output" \
            --stamp "$stamp" \
            --top 50
          echo 'Fixture proof only; this artifact contains no observed live demand.' > "$output/README.md"
      - name: Upload fixture proof
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lookup-miss-fixture-proof
          path: ${{ runner.temp }}/lookup-miss-fixture-proof/
          if-no-files-found: error
          retention-days: 30
      - name: Publish step summary
        if: always()
        shell: bash
        run: |
          {
            echo "# Lookup-miss fixture proof"
            echo
            echo "Fixture proof only; no observed live demand."
            echo
            if [ -f "$RUNNER_TEMP/lookup-miss-fixture-proof/lookup-miss-demand-latest.md" ]; then
              cat "$RUNNER_TEMP/lookup-miss-fixture-proof/lookup-miss-demand-latest.md"
            else
              echo "Report not produced"
            fi
            echo
            echo "## Operator notes"
            echo "- Process real exported Worker logs locally with \`scripts/export_lookup_miss_demand.py --input\`; see \`docs/distribution.md\`."
            echo "- Fixture uses \`scripts/fixtures/lookup_miss_sample.log\`; it does not justify cohort growth."
          } >> "$GITHUB_STEP_SUMMARY"
