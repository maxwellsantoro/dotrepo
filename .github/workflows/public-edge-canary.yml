name: public-edge-canary

on:
  workflow_dispatch:
  schedule:
    # Daily at 14:00 UTC — aligned with the seven-day staleAfter contract.
    - cron: "0 14 * * *"

permissions:
  actions: read # Read latest run ordering without per-run report edits.
  contents: read
  issues: write

concurrency:
  group: public-edge-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || vars.DOTREPO_PUBLIC_EDGE_CANARY_ENABLED == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: maxwellsantoro/pagedigest
          path: sibling-pagedigest
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Create and sync Python environment
        run: |
          uv venv
          uv sync --dev --locked
      - name: Check both public edges
        id: edge_check
        shell: bash
        env:
          DOTREPO_PUBLIC_ARCHIVE_CANARY_ENABLED: ${{ vars.DOTREPO_PUBLIC_ARCHIVE_CANARY_ENABLED }}
        run: |
          archive_args=()
          if [ "$DOTREPO_PUBLIC_ARCHIVE_CANARY_ENABLED" = "true" ]; then
            archive_args+=(--sample-archived-snapshot)
          fi
          uv run python scripts/public_edge_canary.py \
            --pagedigest-repo-root sibling-pagedigest \
            --output public-edge-canary.json \
            "${archive_args[@]}" 2>&1 | tee public-edge-canary.log
      - name: Upload canary report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: public-edge-canary
          path: |
            public-edge-canary.json
            public-edge-canary.log
          if-no-files-found: ignore
      - name: Update the durable canary report on result changes
        if: always() && (steps.edge_check.outcome == 'success' || steps.edge_check.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python scripts/report_public_edge_canary.py \
            --repository "$GITHUB_REPOSITORY" \
            --status "${{ steps.edge_check.outcome }}" \
            --run-id "$GITHUB_RUN_ID" \
            --run-number "$GITHUB_RUN_NUMBER" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --details-file public-edge-canary.log
