name: public-edge-canary

on:
  workflow_dispatch:
  schedule:
    # Daily at 14:00 UTC — aligned with the seven-day staleAfter contract.
    - cron: "0 14 * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: public-edge-canary
  cancel-in-progress: true

jobs:
  canary:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || vars.DOTREPO_PUBLIC_EDGE_CANARY_ENABLED == 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: maxwellsantoro/pagedigest
          path: sibling-pagedigest
      - name: Install uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
      - name: Create and sync Python environment
        run: |
          uv venv
          uv sync --dev --locked
      - name: Check both public edges
        env:
          DOTREPO_PUBLIC_ARCHIVE_CANARY_ENABLED: ${{ vars.DOTREPO_PUBLIC_ARCHIVE_CANARY_ENABLED }}
        run: |
          archive_args=()
          if [ "$DOTREPO_PUBLIC_ARCHIVE_CANARY_ENABLED" = "true" ]; then
            archive_args+=(--sample-archived-snapshot)
          fi
          uv run python scripts/public_edge_canary.py \
            --pagedigest-repo-root sibling-pagedigest \
            --output public-edge-canary.json \
            "${archive_args[@]}"
      - name: Upload canary report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: public-edge-canary
          path: public-edge-canary.json
          if-no-files-found: ignore
      - name: Open or update failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Public edge consistency canary is failing"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          body="The scheduled public-edge canary failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -n "$existing" ]; then
            last_comment_at="$(gh api "repos/$GITHUB_REPOSITORY/issues/$existing/comments" --paginate --jq '.[-1].created_at // empty')"
            if [ -n "$last_comment_at" ]; then
              now_epoch="$(date -u +%s)"
              last_epoch="$(date -u -d "$last_comment_at" +%s)"
              if [ "$((now_epoch - last_epoch))" -lt 82800 ]; then
                echo "Skipping duplicate failure comment; last update was within 23 hours"
                exit 0
              fi
            fi
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "The dotrepo × pagedigest public-edge canary failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
