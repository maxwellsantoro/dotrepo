name: ci

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Optional base commit for a scoped automation check
        required: false
        type: string
  pull_request:
  push:
    branches: [main]

# Only superseded PR runs cancel. Main/dispatch runs have unique groups; public
# deployment keeps its own serialized, non-cancelling publication policy.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege for a read-only validation pipeline. Jobs that need write
# access must set permissions explicitly (none currently do).
permissions:
  contents: read

env:
  # Faster, smaller dev/test builds in CI; local `cargo` is unaffected.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # Require this stable check in branch protection/rulesets. Scoped jobs may
  # skip intentionally; the aggregate requires every planned job to succeed.
  ci-gate:
    needs: [change-scope, rust-and-index, python-gate, operator-gate, public-surface-gate, release-gate, minimal-gate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Create and sync Python environment
        run: |
          uv venv
          uv sync --dev --locked
      - name: Require all selected validation jobs
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: uv run python scripts/check_ci_gate.py

  change-scope:
    runs-on: ubuntu-latest
    outputs:
      run_rust_ci: ${{ steps.scope.outputs.run_rust_ci }}
      run_python_gate: ${{ steps.scope.outputs.run_python_gate }}
      run_operator_gate: ${{ steps.scope.outputs.run_operator_gate }}
      run_public_surface_gate: ${{ steps.scope.outputs.run_public_surface_gate }}
      run_release_gate: ${{ steps.scope.outputs.run_release_gate }}
      run_minimal_gate: ${{ steps.scope.outputs.run_minimal_gate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Classify changed files
        id: scope
        env:
          DISPATCH_BASE_SHA: ${{ inputs.base_sha }}
        run: uv run --no-project python scripts/classify_ci_scope.py --github

  rust-and-index:
    needs: change-scope
    if: needs.change-scope.outputs.run_rust_ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Create and sync Python environment
        run: |
          uv venv
          uv sync --dev --locked
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Enable faster linker when mold is available
        run: |
          if sudo apt-get install -y mold; then
            echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"
            echo "mold linker enabled"
          else
            echo "mold unavailable; using default linker"
          fi
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.19.9 --locked
      - name: Check Rust formatting, linting, tests, and seeded flows
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo deny check advisories licenses bans sources
          cargo test --workspace
          cargo run -p dotrepo-cli -- --root examples/native-minimal validate
          cargo run -p dotrepo-cli -- --root examples/native-minimal generate --check
          # The repository ships its own native .repo; keep it valid so the
          # project dogfoods its own protocol (catches dangling doc references,
          # stale managed-surface paths, and schema drift in the root manifest).
          cargo run -p dotrepo-cli -- --root . validate
          cargo run -p dotrepo-cli -- validate-index
      - name: Verify publishable crates package and dry-run cleanly
        run: |
          cargo publish --dry-run -p dotrepo-schema
          cargo publish --dry-run -p dotrepo-transport
          cargo publish --dry-run -p dotrepo-core
          cargo publish --dry-run -p dotrepo-cli
          cargo publish --dry-run -p dotrepo-lsp
          cargo publish --dry-run -p dotrepo-mcp
      - name: Check the standalone dotrepo alias package
        # Excluded from the workspace (binary name collision with dotrepo-cli),
        # so workspace-wide fmt/clippy/test commands do not cover it. A publish
        # dry-run would mix registry sources with same-version local patches
        # between releases, so verify with a local check instead; the release
        # workflow performs the real publish at tag time.
        run: |
          cargo fmt --manifest-path crates/dotrepo/Cargo.toml -- --check
          cargo check --locked --manifest-path crates/dotrepo/Cargo.toml
      - name: Smoke test MCP stdio server
        run: |
          uv run python - <<'PY'
          import json
          import subprocess

          proc = subprocess.Popen(
              ["cargo", "run", "-p", "dotrepo-mcp"],
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=False,
          )

          # The MCP stdio transport is newline-delimited JSON (one message per
          # line), matching real MCP clients; Content-Length framing is LSP.
          def send(message, expect_response=True):
              proc.stdin.write(json.dumps(message).encode() + b"\n")
              proc.stdin.flush()
              if not expect_response:
                  return None
              line = proc.stdout.readline()
              if not line:
                  raise RuntimeError("unexpected EOF while reading MCP response")
              return json.loads(line)

          init = send({
              "jsonrpc": "2.0",
              "id": 1,
              "method": "initialize",
              "params": {
                  "protocolVersion": "2025-11-25",
                  "capabilities": {},
                  "clientInfo": {"name": "ci-smoke", "version": "0"}
              }
          })
          assert init["result"]["protocolVersion"] == "2025-11-25"

          send({
              "jsonrpc": "2.0",
              "method": "notifications/initialized",
              "params": {}
          }, expect_response=False)

          tools = send({
              "jsonrpc": "2.0",
              "id": 2,
              "method": "tools/list",
              "params": {}
          })
          assert any(tool["name"] == "dotrepo.validate" for tool in tools["result"]["tools"])

          validate = send({
              "jsonrpc": "2.0",
              "id": 3,
              "method": "tools/call",
              "params": {
                  "name": "dotrepo.validate",
                  "arguments": {"root": "examples/native-minimal"}
              }
          })
          structured = validate["result"]["structuredContent"]
          assert structured["valid"] is True
          assert structured["diagnostics"] == []

          query = send({
              "jsonrpc": "2.0",
              "id": 4,
              "method": "tools/call",
              "params": {
                  "name": "dotrepo.query",
                  "arguments": {
                      "root": "examples/native-minimal",
                      "path": "repo.name"
                  }
              }
          })
          assert query["result"]["structuredContent"]["value"] == "orbit"

          trust = send({
              "jsonrpc": "2.0",
              "id": 5,
              "method": "tools/call",
              "params": {
                  "name": "dotrepo.trust",
                  "arguments": {"root": "examples/native-minimal"}
              }
          })
          assert trust["result"]["structuredContent"]["selection"]["reason"] == "only_matching_record"

          preview = send({
              "jsonrpc": "2.0",
              "id": 6,
              "method": "tools/call",
              "params": {
                  "name": "dotrepo.import_preview",
                  "arguments": {
                      "root": "examples/native-minimal",
                      "mode": "native"
                  }
              }
          })
          assert preview["result"]["structuredContent"]["record"]["status"] == "draft"

          import_write = send({
              "jsonrpc": "2.0",
              "id": 7,
              "method": "tools/call",
              "params": {
                  "name": "dotrepo.import_write",
                  "arguments": {
                      "root": "examples/native-minimal",
                      "mode": "native"
                  }
              }
          })
          assert import_write["result"]["isError"] is True
          assert "already exists" in import_write["result"]["structuredContent"]["error"]

          proc.terminate()
          proc.wait(timeout=5)
          PY
      - name: Smoke test LSP stdio server
        run: |
          uv run python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          manifest = Path("examples/native-minimal/.repo").resolve()
          uri = manifest.as_uri()
          text = manifest.read_text()

          proc = subprocess.Popen(
              ["cargo", "run", "-p", "dotrepo-lsp"],
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=False,
          )

          def read_message():
              header = b""
              while b"\r\n\r\n" not in header:
                  chunk = proc.stdout.read(1)
                  if not chunk:
                      raise RuntimeError("unexpected EOF while reading LSP headers")
                  header += chunk
              length = None
              for line in header.decode().split("\r\n"):
                  if line.lower().startswith("content-length:"):
                      length = int(line.split(":", 1)[1].strip())
                      break
              if length is None:
                  raise RuntimeError("missing Content-Length header")
              body = proc.stdout.read(length)
              return json.loads(body)

          def send(message, expect_response=True):
              payload = json.dumps(message).encode()
              proc.stdin.write(f"Content-Length: {len(payload)}\r\n\r\n".encode())
              proc.stdin.write(payload)
              proc.stdin.flush()
              if not expect_response:
                  return None
              return read_message()

          init = send({
              "jsonrpc": "2.0",
              "id": 1,
              "method": "initialize",
              "params": {
                  "processId": None,
                  "capabilities": {},
                  "clientInfo": {"name": "ci-smoke", "version": "0"}
              }
          })
          assert init["result"]["serverInfo"]["name"] == "dotrepo-lsp"

          send({
              "jsonrpc": "2.0",
              "method": "initialized",
              "params": {}
          }, expect_response=False)

          send({
              "jsonrpc": "2.0",
              "method": "textDocument/didOpen",
              "params": {
                  "textDocument": {
                      "uri": uri,
                      "languageId": "toml",
                      "version": 1,
                      "text": text
                  }
              }
          }, expect_response=False)

          diagnostics = read_message()
          assert diagnostics["method"] == "textDocument/publishDiagnostics"
          assert diagnostics["params"]["uri"] == uri
          assert all(
              diagnostic.get("severity", 1) > 3
              for diagnostic in diagnostics["params"]["diagnostics"]
          ), diagnostics["params"]["diagnostics"]

          send({
              "jsonrpc": "2.0",
              "id": 2,
              "method": "shutdown",
              "params": {}
          })
          send({
              "jsonrpc": "2.0",
              "method": "exit",
              "params": {}
          }, expect_response=False)

          proc.wait(timeout=5)
          PY

  operator-gate:
    needs: change-scope
    if: needs.change-scope.outputs.run_operator_gate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Create and sync Python environment
        run: |
          uv venv
          uv sync --dev --locked
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Enable faster linker when mold is available
        run: |
          if sudo apt-get install -y mold; then
            echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"
            echo "mold linker enabled"
          else
            echo "mold unavailable; using default linker"
          fi
      - name: Run explicit maintainer/operator claim gate
        run: uv run python scripts/check_operator_claim_gate.py --output-root operator-gate
      - name: Upload operator gate inspection artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: operator-gate-claim-reports
          path: operator-gate/
          if-no-files-found: error
          retention-days: 14
      - name: Upload staged live-handoff public export
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: operator-gate-live-seed-handoff-public
          path: operator-gate/live-seed-handoff-public/
          if-no-files-found: error
          retention-days: 14

  public-surface-gate:
    needs: change-scope
    if: needs.change-scope.outputs.run_public_surface_gate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Create and sync Python environment
        run: |
          uv venv
          uv sync --dev --locked
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Enable faster linker when mold is available
        run: |
          if sudo apt-get install -y mold; then
            echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"
            echo "mold linker enabled"
          else
            echo "mold unavailable; using default linker"
          fi
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/hosted-query/package-lock.json
      - name: Validate root manifest
        run: cargo run -p dotrepo-cli -- --root . validate
      - name: Run lightweight public-surface gate
        run: uv run python scripts/check_release_gate.py --output-root release-gate --skip-release-bundle --skip-vsix
      - name: Upload gate timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: public-surface-gate-timings
          path: release-gate/timings.*
          if-no-files-found: warn
          retention-days: 14
      - name: Upload static public export artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: public-export-v0-lightweight
          path: release-gate/public/
          if-no-files-found: error
          retention-days: 7
      - name: Upload public export bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: public-export-v0-bundle-lightweight
          path: release-gate/public-bundle/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  python-gate:
    needs: change-scope
    if: needs.change-scope.outputs.run_python_gate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Create and sync Python environment
        run: |
          uv venv
          uv sync --dev --locked
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Enable faster linker when mold is available
        run: |
          if sudo apt-get install -y mold; then
            echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"
            echo "mold linker enabled"
          else
            echo "mold unavailable; using default linker"
          fi
      - name: Check Python tools and actual exporter-to-consumer controls
        run: |
          uv run ruff check
          uv run ruff format --check
          uv run python scripts/check_release_version.py
          uv run python scripts/check_toolchain_manifest_parity.py
          cargo build --locked -p dotrepo-cli
          cargo run -p dotrepo-cli -- --root . validate
          uv run pytest --durations=15

  minimal-gate:
    needs: change-scope
    if: needs.change-scope.outputs.run_minimal_gate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Create and sync Python environment
        run: |
          uv venv
          uv sync --dev --locked
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Enable faster linker when mold is available
        run: |
          if sudo apt-get install -y mold; then
            echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"
            echo "mold linker enabled"
          else
            echo "mold unavailable; using default linker"
          fi
      - name: Run minimal validation gate
        run: |
          uv run ruff check
          uv run ruff format --check
          uv run python scripts/check_release_version.py
          uv run python scripts/check_toolchain_manifest_parity.py
          cargo run -p dotrepo-cli -- --root . validate

  release-gate:
    env:
      PLAYWRIGHT_VERSION: "1.62.1"
    needs: change-scope
    if: needs.change-scope.outputs.run_release_gate == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Create and sync Python environment
        run: |
          uv venv
          uv sync --dev --locked
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Enable faster linker when mold is available
        run: |
          if sudo apt-get install -y mold; then
            echo "RUSTFLAGS=-C link-arg=-fuse-ld=mold" >> "$GITHUB_ENV"
            echo "mold linker enabled"
          else
            echo "mold unavailable; using default linker"
          fi
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            cloudflare/hosted-query/package-lock.json
            editors/vscode/package-lock.json
      - name: Test VS Code extension lifecycle
        working-directory: editors/vscode
        run: npm test
      - name: Run explicit release-surface gate
        run: uv run python scripts/check_release_gate.py --output-root release-gate
      - name: Cache pinned Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ env.PLAYWRIGHT_VERSION }}
      - name: Install pinned browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/dotrepo-browser" --no-save "playwright@$PLAYWRIGHT_VERSION"
          "$RUNNER_TEMP/dotrepo-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify desktop and mobile public presentation
        run: NODE_PATH="$RUNNER_TEMP/dotrepo-browser/node_modules" node scripts/check_public_presentation.cjs release-gate/public release-gate/browser-qa
      - name: Upload browser screenshots and results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: public-presentation-browser-qa
          path: release-gate/browser-qa/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload gate timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-gate-timings
          path: release-gate/timings.*
          if-no-files-found: warn
          retention-days: 14
      - name: Upload static public export artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: public-export-v0
          path: release-gate/public/
          if-no-files-found: error
          retention-days: 14
      - name: Upload public export bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: public-export-v0-bundle
          path: release-gate/public-bundle/*.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Upload release-style install bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-gate-install-bundles
          path: |
            release-gate/release-bundle/*.tar.gz
            release-gate/release-bundle/*.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload release-style VSIX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-gate-vscode-vsix
          path: release-gate/vsix/*.vsix
          if-no-files-found: error
          retention-days: 14
